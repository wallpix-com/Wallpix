{% extends "base.html" %}{% block content %}<main class="wrap detail"><div class="viewer"><img src="{{p.image}}" alt="{{p.title}}"></div><aside><div class="eyebrow">{{p.category}}</div><h1>{{p.title}}</h1><p class="muted">Created by <b>{{p.creator}}</b></p>{% if p.price>0 %}<div class="price">${{"%.2f"|format(p.price)}}</div><button class="btn wide" onclick="alert('Demo checkout. Connect a payment provider before accepting real payments.')">Buy & download</button>{% else %}<a class="btn wide" href="{{p.image}}" target="_blank">Free download</a>{% endif %}<p class="note">Payments and creator payouts are intentionally demo-only in this starter.</p></aside></main>{% endblock %}
