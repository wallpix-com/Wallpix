{% extends "base.html" %}{% block content %}<main class="auth"><div class="authbox"><div class="eyebrow">WALLPIX ACCOUNT</div><h1>{{"Create your account" if mode=="register" else "Welcome back"}}</h1><form method="post">{% if mode=="register" %}<input name="name" placeholder="Your name" required>{% endif %}<input type="email" name="email" placeholder="Email address" required><input type="password" name="password" placeholder="Password" required><button class="btn wide">{{"Create account" if mode=="register" else "Login"}}</button></form><p>{% if mode=="register" %}Already a member? <a href="/login">Login</a>{% else %}New here? <a href="/register">Create an account</a>{% endif %}</p></div></main>{% endblock %}
